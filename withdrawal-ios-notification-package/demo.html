<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Withdrawal notification demo</title>
  <link rel="stylesheet" href="withdrawal-notification.css">
  <style>
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f3f4f6; }
    main { width: min(420px, calc(100% - 32px)); padding: 28px; box-sizing: border-box; background: white; border-radius: 18px; box-shadow: 0 12px 35px rgba(0,0,0,.1); }
    button { width: 100%; padding: 14px; border: 0; border-radius: 12px; color: white; background: #111827; font-size: 16px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Withdrawal notification</h1>
    <p>This preview uses demo values. A real website must pass the amount and new balance returned by its withdrawal endpoint.</p>
    <button id="showDemo" type="button">Run demo</button>
  </main>

  <script src="withdrawal-notification.js"></script>
  <script>
    WithdrawalNotification.configure({
      assetBase: './assets',
      brandName: 'Demo Website'
    });

    document.getElementById('showDemo').addEventListener('click', function () {
      WithdrawalNotification.show({
        amount: 50,
        currentBalance: 350,
        currency: 'GHS'
      });
    });
  </script>
</body>
</html>
